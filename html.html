<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Quantity Input</title>
                  <style>
                        body {      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;      display: flex;      justify-content: center;      align-items: center;      height: 100vh;      background-color: #fcfcfc;      margin: 0;    }
                              .quantity-container {      text-align: left;    }
                                    h2 {      font-size: 2rem;      font-weight: 700;      margin-bottom: 24px;      color: #000;    }
                                          .quantity-input {      display: inline-flex;      align-items: center;      background-color: #ffffff;      padding: 6px 12px;      border-radius: 100px;      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);    }
                                                .quantity-input button {      background: none;      border: none;      font-size: 1.2rem;      cursor: pointer;      width: 36px;      height: 36px;      display: flex;      align-items: center;      justify-content: center;      color: #555;      transition: color 0.2s;    }
                                                      .quantity-input button:hover {      color: #000;    }
                                                            .quantity-input input[type="number"] {      width: 40px;      text-align: center;      border: none;      background: none;      font-size: 1.1rem;      font-weight: 500;      color: #000;      outline: none;    }
                                                                  /* Hide standard browser arrows inside the number input */    .quantity-input input::-webkit-outer-spin-button,    .quantity-input input::-webkit-inner-spin-button {      -webkit-appearance: none;      margin: 0;    }    .quantity-input input[type="number"] {      -moz-appearance: textfield;    }
                                                                      </style>
                                                                        </head>
                                                                          <body>
                                                                              <div class="quantity-container">
                                                                                    <h2>Quantity Input</h2>
                                                                                          <div class="quantity-input">
                                                                                                  <button type="button" id="decrease" aria-label="Decrease quantity">
                                                                                                            −
                                                                                                                    </button>
                                                                                                                            <input type="number" id="quantity" value="6" min="1" />
                                                                                                                                    <button type="button" id="increase" aria-label="Increase quantity">
                                                                                                                                              +
                                                                                                                                                      </button>
                                                                                                                                                            </div>
                                                                                                                                                                </div>
                                                                                                                                                                    <script>
                                                                                                                                                                          const quantityInput = document.getElementById('quantity');    const decreaseBtn = document.getElementById('decrease');    const increaseBtn = document.getElementById('increase');
                                                                                                                                                                                decreaseBtn.addEventListener('click', () => {      let currentValue = parseInt(quantityInput.value) || 0;      let min = parseInt(quantityInput.min) || 1;      if (currentValue > min) {        quantityInput.value = currentValue - 1;      }    });
                                                                                                                                                                                      increaseBtn.addEventListener('click', () => {      let currentValue = parseInt(quantityInput.value) || 0;      quantityInput.value = currentValue + 1;    });
                                                                                                                                                                                          </script>
                                                                                                                                                                                            </body>
                                                                                                                                                                                            </html>
