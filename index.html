<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pen Tracker (Cloud Sync)</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: transparent; 
        margin: 0;
      }
      .quantity-container {
        text-align: center;
      }
      h2 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 16px;
        color: #000;
      }
      .quantity-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .quantity-input {
        display: inline-flex;
        align-items: center;
        background-color: #ffffff;
        padding: 6px 12px;
        border-radius: 100px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        border: 1px solid #e0e0e0;
      }
      .quantity-input button {
        background: none;
        border: none;
        font-size: 1.2rem;
        cursor: pointer;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
        transition: color 0.2s;
      }
      .quantity-input button:hover {
        color: #000;
      }
      .quantity-input input[type="number"] {
        width: 50px;
        text-align: center;
        border: none;
        background: none;
        font-size: 1.2rem;
        font-weight: 600;
        color: #000;
        outline: none;
      }
      .quantity-input input::-webkit-outer-spin-button,
      .quantity-input input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .quantity-input input[type="number"] {
        -moz-appearance: textfield;
      }
      .save-btn {
        background-color: #238636;
        color: white;
        border: none;
        padding: 8px 18px;
        font-size: 0.9rem;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        width: 100%;
      }
      .save-btn:hover {
        background-color: #2ea043;
      }
      .save-btn:disabled {
        background-color: #8cc665;
        cursor: not-allowed;
      }
      .status-text {
        font-size: 0.8rem;
        color: #666;
        margin-top: 4px;
        height: 12px;
      }
    </style>
  </head>
  <body>
    <div class="quantity-container">
      <h2>Finished Pens</h2>
      <div class="quantity-wrapper">
        <div class="quantity-input">
          <button type="button" id="decrease" aria-label="Decrease quantity">−</button>
          <input type="number" id="quantity" value="0" min="0" />
          <button type="button" id="increase" aria-label="Increase quantity">+</button>
        </div>
        <button type="button" id="save" class="save-btn">Save Count</button>
        <div id="status" class="status-text">Loading from cloud...</div>
      </div>
    </div>

    <script>
      const quantityInput = document.getElementById('quantity');
      const decreaseBtn = document.getElementById('decrease');
      const increaseBtn = document.getElementById('increase');
      const saveBtn = document.getElementById('save');
      const statusText = document.getElementById('status');

      // Unique cloud locker name. CHANGE 'my_secret_pen_tracker' to any unique random words so nobody else guesses it!
      const LOCKER_ID = 'my_unique_notion_pen_blahhhtracker_2026'; 
      const API_URL = `https://kvdb.io{LOCKER_ID}`; // Using a public KV bucket

      // 1. Fetch count from the Cloud Database when page opens
      window.addEventListener('DOMContentLoaded', async () => {
        try {
          const response = await fetch(API_URL);
          if (response.ok) {
            const cloudCount = await response.text();
            quantityInput.value = cloudCount !== "" ? cloudCount : "0";
            statusText.textContent = "Synced with cloud";
          } else {
            statusText.textContent = "Ready (No cloud data yet)";
          }
        } catch (error) {
          statusText.textContent = "Offline mode active";
          // Fallback to local storage if internet fails
          const savedCount = localStorage.getItem('finishedPensCount');
          if (savedCount !== null) quantityInput.value = savedCount;
        }
      });

      decreaseBtn.addEventListener('click', () => {
        let currentValue = parseInt(quantityInput.value) || 0;
        if (currentValue > 0) quantityInput.value = currentValue - 1;
      });

      increaseBtn.addEventListener('click', () => {
        let currentValue = parseInt(quantityInput.value) || 0;
        quantityInput.value = currentValue + 1;
      });

      // 2. Save the count to the Cloud Database
      saveBtn.addEventListener('click', async () => {
        const val = quantityInput.value;
        saveBtn.disabled = true;
        statusText.textContent = "Saving to cloud...";

        try {
          // Save to Cloud
          await fetch(API_URL, {
            method: 'POST',
            body: val
          });
          
          // Local fallback backup
          localStorage.setItem('finishedPensCount', val);

          saveBtn.textContent = 'Saved! ✓';
          saveBtn.style.backgroundColor = '#1f6feb';
          statusText.textContent = "Cloud update successful";
        } catch (error) {
          statusText.textContent = "Error saving to cloud!";
          saveBtn.style.backgroundColor = '#da3637';
        }

        setTimeout(() => {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Count';
          saveBtn.style.backgroundColor = '#238636';
        }, 1500);
      });
    </script>
  </body>
</html>
